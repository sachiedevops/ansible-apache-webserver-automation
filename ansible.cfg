
[defaults]

# Inventory file location
inventory = ./inventory/hosts.ini

# Default SSH username
remote_user = ubuntu

# Disable SSH host-key checking (lab use only)
host_key_checking = False

# Display clear task results
stdout_callback = default

# Avoid creating unnecessary retry files
retry_files_enabled = False

# Number of servers Ansible can manage simultaneously
forks = 5

# SSH connection timeout
timeout = 30

[privilege_escalation]

# Run administrative tasks using sudo
become = False
become_method = sudo
become_user = root
become_ask_pass = False
